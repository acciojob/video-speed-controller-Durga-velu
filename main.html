<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Scrubber</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

   <div class="wrapper">
        <video class="flex" width="765" height="430" src="https://www.w3schools.com/html/mov_bbb.mp4" ></video>
        <div id="progress__filled"></div>

        <div id="controls">
        <button class="player__button toggle" id="play-btn">►</button>


        <input type="range" id="volume" min="0" max="10" value="5">

       <input  type="range" id="playbackSpeed" min="0.25" max="2" value="1" step="0.25">
         
       
       <button class="player__button toggle" id="rewindBtn">« 10s</button>
       <button class="player__button toggle" id="skipBtn">25s »</button>
    </div>
    
          <div class="speed">
          <div class="speed-bar">1x</div>
        </div>
      </div>

<script  src="./script.js">
  //Your code goes here
</script>
</body>
</html>
